<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>{% block title %}GardenAI{% endblock %} — AIoT Smart Gardening</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
{% block head %}{% endblock %}
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <polygon points="11,1 20,6 20,16 11,21 2,16 2,6" fill="none" stroke="#3DBA82" stroke-width="1.5"/>
      <circle cx="11" cy="11" r="3" fill="#3DBA82"/>
    </svg>
    GardenAI
  </a>
  <div class="nav-links" id="nav-links">
    <a href="/"          class="nav-link {% if request.endpoint=='index'     %}active{% endif %}">Home</a>
    <a href="/dashboard" class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/plants"    class="nav-link {% if request.endpoint=='plants'    %}active{% endif %}">Plants</a>
    <a href="/analytics" class="nav-link {% if request.endpoint=='analytics' %}active{% endif %}">Analytics</a>
  </div>
  <div class="nav-right">
    <div class="conn-pill">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">Connecting…</span>
    </div>
    <button class="hamburger" id="hamburger">&#9776;</button>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer">
  <div class="footer-inner">
    <span>⬡ GardenAI · AIoT · Random Forest ML · SQLite · Arduino Serial</span>
    <span id="footer-uptime">Uptime: --:--:--</span>
  </div>
</footer>
<script src="{{ url_for('static', filename='js/realtime.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
